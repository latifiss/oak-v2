name: Oak v2 database baseline

on:
  pull_request:
    paths:
      - '.github/workflows/oak-v2-database-baseline.yml'
      - 'packages/db-mongodb/**'
      - 'packages/db-postgres/**'
      - 'packages/drizzle/**'
      - 'packages/payload/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oak-v2-db-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter-build:
    name: Build core and both database adapters
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm run build:core

      - name: Build MongoDB adapter
        run: pnpm run build:db-mongodb

      - name: Build PostgreSQL adapter
        run: pnpm run build:db-postgres
